<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Marcy Music</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <img class="logo" src="img/logo.png" alt="Marcy Music logo">
        <h1>Marcy Music</h1>
        <nav>
            <ul>
                <li><a href="#">Library</a></li>
                <li><a href="#">Explore</a></li>
                <li><a href="#">Profile</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <section class="playlists-section">
            <h2>
                Playlists
            </h2>
            <ul class="plists">
                <li class="plist">
                    <figure>
                        <img src="img/playlist-chill.jpg" alt="Chill Vibes playlist cover">
                        <figcaption>
                            <h4>Chill Vibes</h4>
                        </figcaption>
                    </figure>
                </li>
                <li class="plist">
                    <figure>
                        <img src="img/playlist-focus.jpg" alt="Focus playlist cover">
                        <figcaption>
                            <h4>Focus</h4>
                        </figcaption>
                    </figure>
                </li>
                <li class="plist">
                    <figure>
                        <img src="img/playlist-late-night.jpg" alt="Late Night playlist cover">
                        <figcaption>
                            <h4>Late Night</h4>
                        </figcaption>
                    </figure>
                </li>
                <li class="plist">
                    <figure>
                        <img src="img/playlist-love.jpg" alt="Love Songs playlist cover">
                        <figcaption>
                            <h4>Love Songs</h4>
                        </figcaption>
                    </figure>
                </li>
                <li class="plist">
                    <figure>
                        <img src="img/playlist-oldies.jpg" alt="Oldies playlist cover">
                        <figcaption>
                            <h4>Oldies</h4>
                        </figcaption>
                    </figure>
                </li>
                <li class="plist">
                    <figure>
                        <img src="img/playlist-sad.jpg" alt="Sad playlist cover">
                        <figcaption>
                            <h4>Sad</h4>
                        </figcaption>
                    </figure>
                </li>
            </ul>
        </section>
        <section class="albums-section">
            <h2>
                Albums
            </h2>
            <ul class="albs">
                <li class="alb">
                    <figure>
                        <img src="img/album-midnight-dreams.jpg" alt="Midnight Dreams album cover">
                        <figcaption>
                            <h4>Midnight Dreams</h4>
                            <p>Luna Ray</p>
                        </figcaption>
                    </figure>
                </li>
                <li class="alb">
                    <figure>
                        <img src="img/album-electric-soul.jpg" alt="Electric Soul album cover">
                        <figcaption>
                            <h4>Electric Soul</h4>
                            <p>The Voltage</p>
                        </figcaption>
                    </figure>
                </li>
                <li class="alb">
                    <figure>
                        <img src="img/album-golden-hour.jpg" alt="Golden Hour album cover">
                        <figcaption>
                            <h4>Golden Hour</h4>
                            <p>Sunset Collective</p>
                        </figcaption>
                    </figure>
                </li>
                <li class="alb">
                    <figure>
                        <img src="img/album-kermit-does-jazz.jpg" alt="Kermit Does Jazz album cover">
                        <figcaption>
                            <h4>Kermit Does Jazz</h4>
                            <p>Kermit the Frog</p>
                        </figcaption>
                    </figure>
                </li>
            </ul>
        </section>
    </main>
    <footer>
        Made with &#10084;&#65039; at <a href="#">Marcy Lab School</a>
    </footer>
</body>

</html>
