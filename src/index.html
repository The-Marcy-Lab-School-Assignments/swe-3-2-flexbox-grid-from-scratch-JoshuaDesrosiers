<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>HTML 5 Boilerplate</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <nav>
        <ul>
        <li><img src="img/logo.png"></li>
        <li class="title"><h1>Marcy-music</h1></li>
        <li><a>Library</a></li>
        <li><a>Explore</a></li>
        <li><a>Profile</a></li>
        </ul>
    </nav>
    <main>
        <h2>
            Playlists
        </h2>
        <ul class="plists">
            <li class="plist">
                <figure>
                <img src="img/playlist-chill.jpg">
                <figcaption>
                <h4>Chill Vibes</h4></figcaption>

                </figure>
            </li>
            <li class="plist">
                <figure>
                <img src="img/playlist-focus.jpg">
                <figcaption>
                <h4>Focuss</h4></figcaption>

                </figure>
            </li>
            <li class="plist">
                <figure>
                <img src="img/playlist-late-night.jpg">
                <figcaption>
                <h4>Late Night</h4></figcaption>
                </figure>
            </li>
            <li class="plist">
                <figure>
                <img src="img/playlist-love.jpg">
                <figcaption>
                <h4>Love Songs</h4>
            </figcaption>
                </figure>
            </li>
            <li class="plist">
                <figure>
                <img src="img/playlist-oldies.jpg">
                <figcaption>
                <h4>Oldies</h4>
            </figcaption>
                </figure>
            </li>
            <li class="plist">
                <figure>
                <img src="img/playlist-sad.jpg">
                <figcaption>
                <h4>Sad</h4>
            </figcaption>
                </figure>
            </li>
        </ul>
        <h2>
            Albums
        </h2>
        <ul class="albs">
            <li class="alb">
                <figure>
                    <img src="img/album-midnight-dreams.jpg">

                    <figcaption>
                        <h4>Midnight Dreams</h4>
                        <p>Luna Ray</p>
                    </figcaption>
                </figure>
            </li>
            <li class="alb">
                <figure>
                    <img src="img/album-electric-soul.jpg">

                    <figcaption>
                        <h4>Electric Soul</h4>
                        <p>The voltage</p>
                    </figcaption>
                </figure>
            </li>
            <li class="alb">
                <figure>
                    <img src="img/album-midnight-dreams.jpg">

                    <figcaption>
                        <h4>Golden Hour</h4>
                        <p>Sunset Collective</p>
                    </figcaption>
                </figure>
            </li>
            <li class="alb">
                <figure>
                    <img src="img/album-kermit-does-jazz.jpg">

                    <figcaption>
                        <h4>Kermit Does Jazz</h4>
                        <p>Kermit the Frog</p>
                    </figcaption>
                </figure>
            </li>
        </ul>

    </main>
    <footer>
        Made with <3 at Marcy Lab School

    </footer>

</html>
